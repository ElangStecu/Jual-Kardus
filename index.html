<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jual Kardus</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #333;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .produk {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .produk img {
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
    }

    .harga {
      font-size: 22px;
      font-weight: bold;
    }

    .pesan {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 25px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <header>
    <h1>📦 JUAL KARDUS 📦</h1>
    <p>Kardus untuk packing, pindahan dan pengiriman</p>
  </header>

  <div class="container">

    <div class="produk">

      <img src="https://via.placeholder.com/400x300?text=Foto+Kardus">

      <h2>Kardus Bekas Berkualitas</h2>

      <p>Kondisi masih bagus dan layak digunakan untuk packing.</p>

      <p><b>Ukuran:</b> 40 x 30 x 30 cm</p>

      <p class="harga">Rp5.000 / pcs</p>

      <p>🟢 Stok Tersedia</p>

      <a class="pesan" href="#">
        💬 PESAN SEKARANG
      </a>

    </div>

  </div>

</body>
</html>
